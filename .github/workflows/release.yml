# Changesets release flow. On each master push, this either opens/updates a
# "Version Packages" PR (pending .changeset entries -> version bump +
# CHANGELOG.md), or, when that PR is merged, publishes to npm and pushes the
# vX.Y.Z tag + GitHub release.
#
# Publishing uses npm trusted publishing (OIDC, no NPM_TOKEN), which also
# attaches provenance. The npm-side Trusted Publisher config is bound to this
# workflow filename (release.yml): do not rename it without updating
# https://www.npmjs.com/package/react-native-view-shot/access.
#
# Hardening:
# - No dependency lifecycle scripts run anywhere in this workflow: lib/ is
#   built with plain `tsc` in a read-only job, and the publishing job installs
#   with scripts disabled, uses no shared cache, keeps no git credentials on
#   disk, and publishes the prebuilt lib/ artifact.
# - Actions are pinned to commit SHAs (Dependabot keeps them up to date).
name: Release

on:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NPM_CONFIG_FETCH_RETRIES: 5
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: 20000
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: 120000
  NPM_CONFIG_IGNORE_SCRIPTS: 'true'

jobs:
  build:
    name: Build lib/
    runs-on: ubuntu-latest
    # Forks must not try to publish.
    if: github.repository == 'gre/react-native-view-shot'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies (no scripts)
        # --legacy-peer-deps for react-native-windows@0.76.17
        run: npm ci --legacy-peer-deps

      - name: Build lib/
        run: npm run build && test -f lib/index.js && test -f lib/index.d.ts

      - name: Upload lib/
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lib
          path: lib/
          retention-days: 7 # lets "Re-run failed jobs" reuse it
          if-no-files-found: error

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # version commit, tag, GitHub release
      pull-requests: write # "Version Packages" PR
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # changesets/action pushes through the GitHub API with its token input.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check npm supports trusted publishing (>= 11.5.1)
        run: |
          v=$(npm --version)
          echo "npm $v"
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) {
              console.error("npm >= 11.5.1 is required for trusted publishing");
              process.exit(1);
            }' "$v"

      - name: Install dependencies (no scripts)
        run: npm ci --legacy-peer-deps

      - name: Download lib/
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lib
          path: lib/

      - name: Create release PR or publish to npm
        # NPM_CONFIG_IGNORE_SCRIPTS still runs these two `npm run` scripts, and
        # makes `npm publish` skip `prepare`, so the lib/ artifact ships as-is.
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: npm run version-packages
          publish-script: npm run release
        env:
          # Read by @changesets/changelog-github for PR links and author credits.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
