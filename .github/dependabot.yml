# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# Strategy:
# - Library (root): monthly grouped dev-tooling updates. react majors and
#   react-native minors/majors (breaking in 0.x) are ignored: the dev copies
#   are upgraded deliberately, alongside the supported RN range.
# - Example apps: their dependency trees are pinned to a given RN / Expo /
#   RNW template, so routine version bumps are disabled
#   (open-pull-requests-limit: 0). Security updates still come through and are
#   grouped into one PR per app (one entry per app so groups never span apps).
# - GitHub Actions: monthly, grouped.

version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    ignore:
      - dependency-name: react-native
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: react-test-renderer
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react"
        update-types: [version-update:semver-major]
    groups:
      dev-tooling:
        applies-to: version-updates
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /example
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore(deps)
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /example-expo
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore(deps)
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /example-web
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore(deps)
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /example-windows
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore(deps)
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
